# Telegraf → ProbeHarbor Prometheus scrape → InfluxDB 2.x (or any outputs you prefer)
#
# 1. Create a Pro API key: Dashboard → Share → API keys
# 2. Set PROBEHARBOR_API_KEY in the environment (or replace below)
# 3. telegraf --config probeharbor.conf
#
# Docs: https://probeharbor.dev/integrations/influx
# Metric: probeharbor_sensor_value{device,key,kind}

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "60s"
  hostname = ""
  omit_hostname = true

[[inputs.prometheus]]
  urls = ["https://probeharbor.dev/api/v1/metrics"]
  bearer_token = "${PROBEHARBOR_API_KEY}"
  metric_version = 2
  response_timeout = "15s"
  name_prefix = ""

# --- InfluxDB 2.x ---
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# --- VictoriaMetrics / Prometheus remote write (optional; comment out Influx above) ---
