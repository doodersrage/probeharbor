name: CI

on:
  push:
    branches: [main]
  pull_request:

# Placeholder env so `astro build` can evaluate modules that construct clients at import time.
# These are not production secrets — Cloudflare/runtime uses real Worker secrets.
env:
  SITE_URL: https://example.com
  ORIGIN: https://example.com
  GARAGE_TEMP_FEED_URL: https://example.com/feed.json
  OPENWEATHER_API_KEY: ci-placeholder
  OPENWEATHER_CITY_ID: "5128581"
  TURNSTILE_SITE_KEY: ci-placeholder
  TURNSTILE_SECRET_TOKEN: ci-placeholder
  SMTP_MAIL_FROM: ci@example.com
  SMTP_MAIL_TO: ci@example.com
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  STRIPE_PRICE_ID: price_ci_placeholder
  STRIPE_PRICE_ID_PRO: price_ci_placeholder_pro
  STRIPE_DISPLAY_MEMBER_MONTHLY: "4"
  STRIPE_DISPLAY_MEMBER_ANNUAL: "40"
  STRIPE_DISPLAY_PRO_MONTHLY: "10"
  STRIPE_DISPLAY_PRO_ANNUAL: "100"
  STRIPE_DISPLAY_PORTFOLIO_MONTHLY: "29"
  STRIPE_DISPLAY_PORTFOLIO_ANNUAL: "290"
  STRIPE_PRICE_ID_ANNUAL: price_ci_placeholder_annual
  STRIPE_PRICE_ID_PRO_ANNUAL: price_ci_placeholder_pro_annual
  STRIPE_PRICE_ID_PORTFOLIO: price_ci_placeholder_portfolio
  STRIPE_PRICE_ID_PORTFOLIO_ANNUAL: price_ci_placeholder_portfolio_annual
  PRICING_DEFAULT_INTERVAL: annual
  CRON_SECRET: ci-cron-secret
  VAPID_PUBLIC_KEY: ci-placeholder
  VAPID_PRIVATE_KEY: ci-placeholder
  VAPID_SUBJECT: mailto:ci@example.com

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Node 24 LTS; check-latest so a runner cache never serves an old 24.x.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Node 24 LTS; check-latest so a runner cache never serves an old 24.x.
          check-latest: true
          cache: pnpm
      # Blocking: lint errors fail CI. Formatting isn't enforced (most files
      # predate the Biome formatter); run `pnpm format` to adopt it.
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Node 24 LTS; check-latest so a runner cache never serves an old 24.x.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Catches broken Astro imports (unit tests alone do not run Vite rollup).
      - run: pnpm build || (rm -rf node_modules/.vite && pnpm build)

  # Neon move (IMPLEMENTATION_PLAN.md): SQL and access tests against a real
  # Postgres 18 with db/migrations applied. Postgres runs only inside this job.
  db:
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-local-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # Authenticated specs sign in against the Neon dev branch (see the step
    # before test:e2e). Stripe values are inlined at build time, so they mirror
    # deploy.yml.
    env:
      SITE_URL: ${{ secrets.SITE_URL || 'https://probeharbor.dev' }}
      ORIGIN: ${{ secrets.ORIGIN || 'https://probeharbor.dev' }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY || 'ci-placeholder' }}
      TURNSTILE_SECRET_TOKEN: ${{ secrets.TURNSTILE_SECRET_TOKEN || 'ci-placeholder' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_ci_placeholder' }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID || 'price_ci_placeholder' }}
      STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO || 'price_ci_placeholder_pro' }}
      STRIPE_PRICE_ID_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_ANNUAL || 'price_ci_placeholder_annual' }}
      STRIPE_PRICE_ID_PRO_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PRO_ANNUAL || 'price_ci_placeholder_pro_annual' }}
      STRIPE_PRICE_ID_PORTFOLIO: ${{ secrets.STRIPE_PRICE_ID_PORTFOLIO || 'price_ci_placeholder_portfolio' }}
      STRIPE_PRICE_ID_PORTFOLIO_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PORTFOLIO_ANNUAL || 'price_ci_placeholder_portfolio_annual' }}
      STRIPE_DISPLAY_MEMBER_MONTHLY: ${{ secrets.STRIPE_DISPLAY_MEMBER_MONTHLY || '4' }}
      STRIPE_DISPLAY_MEMBER_ANNUAL: ${{ secrets.STRIPE_DISPLAY_MEMBER_ANNUAL || '40' }}
      STRIPE_DISPLAY_PRO_MONTHLY: ${{ secrets.STRIPE_DISPLAY_PRO_MONTHLY || '10' }}
      STRIPE_DISPLAY_PRO_ANNUAL: ${{ secrets.STRIPE_DISPLAY_PRO_ANNUAL || '100' }}
      STRIPE_DISPLAY_PORTFOLIO_MONTHLY: ${{ secrets.STRIPE_DISPLAY_PORTFOLIO_MONTHLY || '29' }}
      STRIPE_DISPLAY_PORTFOLIO_ANNUAL: ${{ secrets.STRIPE_DISPLAY_PORTFOLIO_ANNUAL || '290' }}
      PRICING_DEFAULT_INTERVAL: ${{ secrets.PRICING_DEFAULT_INTERVAL || 'annual' }}
      # GitHub secret names kept from before the move (only the prefix is old).
      E2E_TEST_EMAIL: ${{ secrets.SUPABASE_E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.SUPABASE_E2E_TEST_PASSWORD }}
      # Inbox the owner controls; household-invites.spec.ts sends real invites there.
      E2E_INVITE_EMAIL: ${{ secrets.E2E_INVITE_EMAIL }}
      # The preview's database and secret; e2e/helpers/auth.ts signs in with them too.
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Node 24 LTS; check-latest so a runner cache never serves an old 24.x.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build || (rm -rf node_modules/.vite && pnpm build)
      # Signed-in specs use the Neon dev branch (scrubbed copy; has the e2e
      # account), never production. The preview reads dist/server/.dev.vars as
      # Worker secrets at runtime, so these aren't baked into the build.
      - name: Database for signed-in specs (Neon dev branch)
        run: |
          mkdir -p dist/server
          printf 'DATABASE_URL="%s"\nBETTER_AUTH_SECRET="%s"\n' "$E2E_DATABASE_URL" "$E2E_BETTER_AUTH_SECRET" >> dist/server/.dev.vars
      # Do not set PLAYWRIGHT_BASE_URL here — that disables webServer and nothing listens on :4321.
      - run: pnpm test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    # Informational only: catches perf/SEO/accessibility regressions on the public
    # marketing pages without blocking merges. Scores are reported, not enforced —
    # tighten lighthouserc.json's assertions (warn -> error) once there's a baseline.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Node 24 LTS; check-latest so a runner cache never serves an old 24.x.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build || (rm -rf node_modules/.vite && pnpm build)
      - name: Start preview server
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/ > /dev/null && exit 0
            sleep 2
          done
          echo "Preview server did not become ready in time" >&2
          exit 1
      - name: Run Lighthouse CI
        # Accessibility, best practices and SEO (>= 0.9) block the deploy; performance only warns.
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.json
      - name: Stop preview server
        if: always()
        run: kill "$(cat preview.pid)" 2>/dev/null || true
