name: Deploy

# Runs after CI finishes on main, so a push that fails typecheck/lint/build/e2e
# never ships (including admin pushes that bypass the branch ruleset).
# workflow_dispatch stays as a manual override.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Production builds must use real secrets (Astro inlines import.meta.env at build time).
# CI placeholders here would ship a broken Worker. Values come from repo secrets
# synced via: CLOUDFLARE_API_TOKEN=... pnpm setup:github-secrets
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SITE_URL: ${{ secrets.SITE_URL }}
  ORIGIN: ${{ secrets.ORIGIN }}
  GARAGE_TEMP_FEED_URL: ${{ secrets.GARAGE_TEMP_FEED_URL }}
  OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
  OPENWEATHER_CITY_ID: ${{ secrets.OPENWEATHER_CITY_ID }}
  TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
  TURNSTILE_SECRET_TOKEN: ${{ secrets.TURNSTILE_SECRET_TOKEN }}
  SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
  SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
  STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO }}
  STRIPE_DISPLAY_MEMBER_MONTHLY: ${{ secrets.STRIPE_DISPLAY_MEMBER_MONTHLY }}
  STRIPE_DISPLAY_MEMBER_ANNUAL: ${{ secrets.STRIPE_DISPLAY_MEMBER_ANNUAL }}
  STRIPE_DISPLAY_PRO_MONTHLY: ${{ secrets.STRIPE_DISPLAY_PRO_MONTHLY }}
  STRIPE_DISPLAY_PRO_ANNUAL: ${{ secrets.STRIPE_DISPLAY_PRO_ANNUAL }}
  STRIPE_DISPLAY_PORTFOLIO_MONTHLY: ${{ secrets.STRIPE_DISPLAY_PORTFOLIO_MONTHLY }}
  STRIPE_DISPLAY_PORTFOLIO_ANNUAL: ${{ secrets.STRIPE_DISPLAY_PORTFOLIO_ANNUAL }}
  STRIPE_PRICE_ID_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_ANNUAL }}
  STRIPE_PRICE_ID_PRO_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PRO_ANNUAL }}
  STRIPE_PRICE_ID_PORTFOLIO: ${{ secrets.STRIPE_PRICE_ID_PORTFOLIO }}
  STRIPE_PRICE_ID_PORTFOLIO_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PORTFOLIO_ANNUAL }}
  PRICING_DEFAULT_INTERVAL: ${{ secrets.PRICING_DEFAULT_INTERVAL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
  FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  SENTRY_URL: ${{ secrets.SENTRY_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only pushes to this repo's main: pull_request CI runs (including forks with
    # a branch named main) must never reach the production secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Each CI run on main triggers its own deploy. If a newer commit has landed
      # since, leave the deploy to that commit's run so an older build never ships last.
      - name: Skip if main has moved on
        if: github.event_name == 'workflow_run'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$tip" ] && [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::Deploy skipped — main is now at ${tip}, newer than ${HEAD_SHA}."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Require production build secrets
        if: env.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy skipped — missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ "$SUPABASE_URL" = "https://example.supabase.co" ]; then
            echo "::notice::Deploy skipped — production SUPABASE_* GitHub secrets not synced."
            echo "Run locally: CLOUDFLARE_API_TOKEN=... pnpm setup:github-secrets"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$SITE_URL" ] || [[ "$SITE_URL" != *"probeharbor.dev"* ]]; then
            echo "::notice::Deploy skipped — SITE_URL secret must be https://probeharbor.dev"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: env.skip != 'true'
        with:
          version: 9

      - uses: actions/setup-node@v5
        if: env.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: env.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: env.skip != 'true'
        run: pnpm typecheck
      - if: env.skip != 'true'
        run: pnpm test
      - if: env.skip != 'true'
        run: pnpm build || (rm -rf node_modules/.vite && pnpm build)

      - name: Build developer docs into the site (/developers/)
        if: env.skip != 'true'
        run: |
          pnpm --dir docs install --frozen-lockfile --ignore-workspace
          pnpm docs:build:site

      - name: Deploy to Cloudflare Workers
        if: env.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if ! npx wrangler whoami >/dev/null 2>&1; then
            echo "::notice::Deploy skipped — Cloudflare token invalid or lacks Workers permissions."
            exit 0
          fi
          npx wrangler deploy --config dist/server/wrangler.json

      # Static files (OG images, assetlinks.json, /developers docs) otherwise stay
      # stale at the edge after a deploy. Needs a token with Zone → Cache Purge.
      - name: Purge Cloudflare cache
        if: env.skip != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: 2c2e86eb7acbef933dc29dfae7ddf9be # probeharbor.dev
        run: |
          if [ -z "$CLOUDFLARE_PURGE_TOKEN" ]; then
            echo "::notice::Cache purge skipped — set the CLOUDFLARE_PURGE_TOKEN secret."
            exit 0
          fi
          result=$(curl -sS -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --data '{"purge_everything":true}')
          if [ "$(echo "$result" | jq -r '.success')" != "true" ]; then
            echo "::warning::Cache purge failed: $(echo "$result" | jq -c '.errors')"
            exit 0
          fi
          echo "Purged probeharbor.dev edge cache."

      - name: Submit public URLs to IndexNow
        if: env.skip != 'true'
        continue-on-error: true
        run: node scripts/ping-sitemaps.mjs "$SITE_URL"
